<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#1e1a26"/>
    </linearGradient>
  </defs>
  <!-- The stock GNOME terminal shape: a dark screen on a slightly raised base, with the "> HT_" mark. -->
  <rect x="8" y="14" width="112" height="104" rx="14" fill="#1e1a26"/>
  <rect x="8" y="10" width="112" height="104" rx="14" fill="url(#edge)"/>
  <rect x="12" y="14" width="104" height="96" rx="10" fill="url(#tile)"/>
  <rect x="12" y="14" width="104" height="10" rx="5" fill="#ffffff" opacity="0.06"/>
  <text x="64" y="72" text-anchor="middle" font-family="monospace" font-weight="700" font-size="28" fill="#f6f5f4">&gt; HT_</text>
</svg>
