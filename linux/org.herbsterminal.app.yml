# Herb's Terminal for Linux as a Flatpak. Build it with script/build_flatpak.sh (on macOS, in a Linux VM through
# Apple's `container`) or directly on Linux:
#   flatpak-builder --user --install --force-clean build linux/org.herbsterminal.app.yml
id: org.herbsterminal.app
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6
command: herbs-terminal
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # The host's devices, so terminals are created in the host's /dev/pts: programs on the host can then name
  # their terminal (`tty`, GPG_TTY), which a sandbox-only /dev/pts doesn't allow.
  - --device=all
  # A terminal and file manager for administrators: shells, ssh and sudo run on the host (flatpak-spawn), and the
  # explorer reaches every folder there.
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=host
  - --filesystem=host-os:ro
  - --filesystem=host-etc:ro
  # The shared-connection sockets and the shell helpers live in /tmp/herbs-<uid>, shared with the host's ssh.
  - --filesystem=/tmp
build-options:
  append-path: /usr/lib/sdk/swift6/bin
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala
  - /share/locale/*/LC_MESSAGES/vte*
  - '*.a'
modules:
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dgir=false
      - -Dvapi=false
      - -Ddocs=false
      - -Dglade=false
      - -Dapp=false
      - -D_systemd=false
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.82/vte-0.82.4.tar.xz
        sha256: 6b1c06fb4df10c82661e3596130fc6bf77a2fa9f57d8432826b1d5eca23bf3e1

  # tailcat (BSD-3-Clause), Tailscale's official Linux release, for Tailcat peers.
  - name: tailcat
    buildsystem: simple
    build-commands:
      - install -Dm755 tailcat /app/bin/tailcat
      - install -Dm644 LICENSE /app/share/licenses/org.herbsterminal.app/tailcat-LICENSE.txt
    sources:
      - type: archive
        only-arches: [aarch64]
        strip-components: 0
        url: https://github.com/tailscale/tailcat/releases/download/v0.7.0/tailcat_0.7.0_linux_arm64.tar.gz
        sha256: bbb1ab50f24f00effe1e1fd86d0501803fb80793a90785a2a16ff3428f03d8ef
      - type: archive
        only-arches: [x86_64]
        strip-components: 0
        url: https://github.com/tailscale/tailcat/releases/download/v0.7.0/tailcat_0.7.0_linux_amd64.tar.gz
        sha256: 23c0b1887a5ec422f0d18a9c52b4f5357815febdaae738a1eb54036d10bd9ee6

  - name: herbs-terminal
    buildsystem: simple
    build-commands:
      - sh linux/install.sh /app
    sources:
      # The whole repository: the Linux package links to the macOS app's shared sources.
      - type: dir
        path: ..
        skip:
          - .build
          - dist
          - linux/.build
          - linux/build
          - linux/.flatpak-builder
          - .git
